name: Obsidian NuGet import
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Authenticate to the private Obsidian NuGet feed
        shell: pwsh
        env:
          FEED_TOKEN: "${{ secrets.OBSIDIAN_PACKAGES_TOKEN }}"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FEED_TOKEN)) {
            throw "Configure the OBSIDIAN_PACKAGES_TOKEN repository secret (read:packages)."
          }
          dotnet nuget add source https://nuget.pkg.github.com/slim16165/index.json --name obsidian --username Idiopathy-shh --password $env:FEED_TOKEN --store-password-in-clear-text
      - name: Build and test viewer
        shell: pwsh
        working-directory: src/Nodilume.Viewer
        run: |
          npm ci
          npm test
          npm run build
      - name: Restore locked NuGet packages
        run: dotnet restore src/Nodilume.Desktop/Nodilume.Desktop.csproj --locked-mode
      - name: Run Nodilume tests
        run: dotnet run --project tests/Nodilume.Tests -c Release --no-restore
      - name: Compile WPF desktop
        run: dotnet build src/Nodilume.Desktop/Nodilume.Desktop.csproj -c Release --no-restore
